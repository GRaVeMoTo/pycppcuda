name: Python Check

on:
  push:
  pull_request:

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Lint
        run: ruff check .
      - name: Check Python syntax
        run: python -m py_compile blurs.py config.py drawgraphs.py main.py setup.py
