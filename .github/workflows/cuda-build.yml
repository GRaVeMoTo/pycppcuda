name: CUDA Extension Build

on:
  push:
  pull_request:

jobs:
  build-extension:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.0.2-cudnn-devel-ubuntu24.04
    env:
      CUDA_HOME: /usr/local/cuda
    steps:
      - uses: actions/checkout@v7
      - name: Install Python build dependencies
        run: apt-get update && apt-get install --yes build-essential git python3 python3-dev python3-pip python3-venv
      - name: Install PyTorch and setuptools
        run: python3 -m pip install --break-system-packages setuptools wheel torch --index-url https://download.pytorch.org/whl/cu130
      - name: Build CUDA extension
        run: python3 setup.py build_ext --inplace
