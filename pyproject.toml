[project]
name = "pycppcuda"
version = "0.1.0"
description = "Speed experience with CUDA"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.3.0",
    "setuptools>=83.0.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["setuptools>=61.0.0", "torch", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint.isort]
known-first-party = ["pycuda_extension"]
